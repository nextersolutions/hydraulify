  .subtitle, .meta-line { font-size: 10.5px; fill: var(--faint); }
  .note-heading { font-size: 10px; font-weight: 600; fill: var(--ink); }
  .note-body { font-size: 9.5px; fill: var(--faint); }
  .frame { fill: none; stroke: var(--ink); stroke-width: 1; }
