s="port-label" text-anchor="middle">T</text><text x="76" y="-5" class="port-label" text-anchor="middle">A</text><text x="92" y="-5" class="port-label" text-anchor="middle">B</text><text x="62" y="70" class="tag" text-anchor="middle">V1</text></g><g id="component-V2" class="component component-shut_off_valve" transform="translate(660 84)" data-focus="V2" data-type="shut_off_valve"><polygon points="10,18 10,34 26,26" class="sym" fill="none"/><polygon points="42,18 42,34 26,26" class="sym" fill="none"/><line x1="0" y1="26" x2="10" y2="26" class="sym"/><line x1="42" y1="26" x2="52" y2="26" class="sym"/><line x1="26" y1="26" x2="26" y2="8" class="sym"/><line x1="19" y1="8" x2="33" y2="8" class="sym"/><text x="26" y="48" class="tag" text-anchor="middle">V2</text><text x="26" y="60" class="param" text-anchor="middle">Gas isolation</text></g></g><g class="title-block"><text x="1152" y="-8" class="title" text-anchor="end">Power unit with a nitrogen back-up bottle</text><text x="1152" y="8" class="subtitle" text-anchor="end">Piston accumulator whose gas side is extended by an isolable nitrogen bottle</text><text x="1152" y="24" class="meta-line" text-anchor="end">Units: SI (bar, L/min, mm)  |  ISO 1219-style schematic</text><text x="1152" y="38" class="meta-line" text-anchor="end">Validation: 1 note - see validation report</text></g><g class="notes"><text x="3" y="748" class="note-heading" text-anchor="start">Assumptions</text><text x="3" y="760" class="note-body" text-anchor="start">CV1: The accumulator is isolated from the pump by a check valve, so stored energy cannot drive the pump backwards.</text><text x="3" y="772" class="note-body" text-anchor="start">ACC1: A piston accumulator, because a back-up bottle adds gas volume behind a separator and a piston is the usual one for it.</text><text x="3" y="784" class="note-body" text-anchor="start">V2: The bottle can be isolated from the accumulator, so either can be charged or serviced alone.</text><text x="3" y="796" class="note-body" text-anchor="start">V1: Drawn as a 4/2 valve with a spring return, so the cylinder has a defined rest position.</text></g>
</svg>
